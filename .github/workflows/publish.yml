name: Publish

# Releases ship from here and nowhere else. `scripts/guard-publish.ts` runs as
# prepublishOnly in every package and hard-fails outside CI, so a local `npm publish`
# is impossible rather than merely discouraged — the single exception being a one-time
# 0.0.0 to claim a package name, which a registry can only ever accept once.
#
# Even from here a release cannot go live on its own. This workflow *stages* each
# package; a maintainer then approves it on npmjs.com (Staged Packages tab) or with
# `npm stage approve <stage-id>`, which demands 2FA. The trusted publisher on each
# package allows stage publishing only, so a compromised workflow or token can at
# worst submit a version for review. Approve core before sdk and cli: they depend on it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and inspect without publishing
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read
  # Trusted publishing: npm exchanges this OIDC token for short-lived credentials, so
  # there is no NPM_TOKEN and no secret of any kind. It also provides the provenance
  # attestation that makes a published artifact traceable to this workflow and commit.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      # Bun installs; npm publishes. Provenance attestation is an npm feature.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1, staged publishing >= 11.15.0.
      - name: Ensure npm supports trusted and staged publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run typecheck && bun test && bun run format:check

      - name: Build
        run: bun run build

      # `workspace:*` is a Bun protocol npm does not understand. Publishing without
      # this rewrite ships an SDK that declares a dependency on the literal string
      # "workspace:*" and fails to install for everyone.
      - name: Resolve workspace dependency ranges
        run: |
          bun run scripts/resolve-workspace-deps.ts
          bun run scripts/resolve-workspace-deps.ts --check

      # Publishing a version the tag does not name is how a release goes out
      # pointing at the wrong source.
      - name: Tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/core packages/sdk packages/cli; do
            version="$(node -p "require('./$pkg/package.json').version")"
            if [ "$version" != "$tag" ]; then
              echo "::error::$pkg is at $version but the tag says $tag"
              exit 1
            fi
          done
          echo "all packages at $tag"

      - name: Stage for approval
        run: |
          # core first: the other two depend on it, and a published package whose
          # dependency does not yet exist is broken for anyone who installs it in
          # the window between. Approve them in the same order.
          for pkg in packages/core packages/sdk packages/cli; do
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "--- dry run: $pkg ---"
              (cd "$pkg" && npm pack --dry-run)
            else
              # No NODE_AUTH_TOKEN: npm detects the OIDC token from id-token above.
              # Provenance is generated automatically under trusted publishing.
              (cd "$pkg" && npm stage publish --access public)
            fi
          done
